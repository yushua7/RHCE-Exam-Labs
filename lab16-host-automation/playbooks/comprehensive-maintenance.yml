---
- name: Comprehensive System Maintenance Workflow
  hosts: all
  become: yes
  serial: 1
  vars:
    maintenance_window_start: "{{ ansible_facts.date_time.iso8601 }}"

  pre_tasks:
    - name: Create maintenance log directory
      file:
        path: /var/log/maintenance
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Start maintenance logging
      copy:
        content: |
          Maintenance started at: {{ maintenance_window_start }}
          Host: {{ ansible_facts.hostname }}
          Maintenance tasks planned:
          1. Pre-maintenance health check
          2. Package updates
          3. Log rotation
          4. Service management
          5. Conditional system reboot
          6. Post-maintenance health check
        dest: /var/log/maintenance/maintenance-{{ ansible_facts.date_time.epoch }}.log
        owner: root
        group: root
        mode: '0644'

  tasks:
    - name: Phase 1 - Pre-maintenance health check
      include_tasks: ../tasks/health-check.yml
      vars:
        check_phase: "pre-maintenance"

    - name: Phase 2 - Update system packages
      include_tasks: ../tasks/package-updates.yml

    - name: Phase 3 - Configure log rotation
      include_tasks: ../tasks/log-rotation.yml

    - name: Phase 4 - Service management
      include_tasks: ../tasks/service-management.yml

    - name: Phase 5 - Conditional system reboot
      include_tasks: ../tasks/conditional-reboot.yml

    - name: Phase 6 - Post-maintenance health check
      include_tasks: ../tasks/health-check.yml
      vars:
        check_phase: "post-maintenance"

  post_tasks:
    - name: Generate comprehensive maintenance report
      template:
        src: ../templates/maintenance-report.j2
        dest: "/var/log/maintenance/maintenance-report-{{ ansible_facts.date_time.epoch }}.html"
        owner: root
        group: root
        mode: '0644'

    - name: Update maintenance log with completion
      lineinfile:
        path: /var/log/maintenance/maintenance-{{ ansible_facts.date_time.epoch }}.log
        line: "Maintenance completed at: {{ ansible_facts.date_time.iso8601 }}"
        create: yes

    - name: Display maintenance summary
      debug:
        msg: >
          Maintenance completed for {{ ansible_facts.hostname }}.
          Start time: {{ maintenance_window_start }}.
          End time: {{ ansible_facts.date_time.iso8601 }}.
          Reboot required this run: {{ maintenance_reboot_needed | default('N/A') }}.
          Check /var/log/maintenance/ for detailed reports.

---
- name: Check for reboot indicator file
  stat:
    path: /var/run/reboot-required
  register: maintenance_reboot_file

- name: Determine if reboot is needed
  set_fact:
    maintenance_reboot_needed: "{{ maintenance_reboot_file.stat.exists or (reboot_required | default(false)) }}"

- name: Display reboot decision
  debug:
    msg: "Reboot required: {{ maintenance_reboot_needed }}"

- name: Reboot the system if required
  reboot:
    reboot_timeout: 600
    pre_reboot_delay: 10
    post_reboot_delay: 30
    test_command: uptime
  when: maintenance_reboot_needed

- name: Remove reboot indicator file after reboot
  file:
    path: /var/run/reboot-required
    state: absent
  when: maintenance_reboot_needed

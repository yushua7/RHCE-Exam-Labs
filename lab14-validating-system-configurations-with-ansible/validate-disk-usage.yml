---
- name: Validate System Disk Usage
  hosts: all
  gather_facts: yes

  vars:
    disk_usage_warning_threshold: 80
    disk_usage_critical_threshold: 90
    minimum_free_space_gb: 1

  tasks:

    - name: Initialize per-host result
      set_fact:
        disk_check_status: "UNKNOWN"
        disk_check_detail: ""

    - name: Validate root filesystem disk usage
      block:

        - name: Get root mount info
          set_fact:
            root_mount_info: "{{ ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first }}"

        - name: Calculate used space
          set_fact:
            root_used: "{{ root_mount_info.size_total - root_mount_info.size_available }}"

        - name: Calculate usage percentage
          set_fact:
            root_usage_percent: "{{ (root_used / root_mount_info.size_total * 100) | round(2) }}"

        - name: Calculate free space
          set_fact:
            root_free_gb: "{{ (root_mount_info.size_available / 1024 / 1024 / 1024) | round(2) }}"

        - name: Fail if usage exceeds critical threshold
          fail:
            msg: "Disk usage on {{ ansible_hostname }} is {{ root_usage_percent }}%, exceeding critical threshold of {{ disk_usage_critical_threshold }}%"
          when: root_usage_percent | float > disk_usage_critical_threshold | float

        - name: Fail if free space is below minimum requirement
          fail:
            msg: "Free space on {{ ansible_hostname }} is {{ root_free_gb }} GB, below minimum of {{ minimum_free_space_gb }} GB"
          when: root_free_gb | float < minimum_free_space_gb | float

        - name: Warn if usage exceeds warning threshold
          set_fact:
            disk_check_status: "WARNING"
            disk_check_detail: "Usage {{ root_usage_percent }}% exceeds warning threshold of {{ disk_usage_warning_threshold }}%"
          when: root_usage_percent | float > disk_usage_warning_threshold | float

        - name: Mark as OK when within thresholds
          set_fact:
            disk_check_status: "OK"
            disk_check_detail: "Usage {{ root_usage_percent }}%, free {{ root_free_gb }} GB"
          when: disk_check_status == "UNKNOWN"

      rescue:
        - name: Record failed disk validation
          set_fact:
            disk_check_status: "CRITICAL"
            disk_check_detail: "{{ ansible_failed_result.msg }}"

    - name: Display disk validation result
      debug:
        msg: "[{{ ansible_hostname }}] Disk check status: {{ disk_check_status }} - {{ disk_check_detail }}"
